[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protect3"
version = "0.3.0"
description = "Android ARM64 ELF protection with explicit capability reporting"
requires-python = ">=3.10"

[project.scripts]
protect3 = "protect3.cli:main"

[tool.setuptools.packages.find]
include = ["protect3*"]

[tool.setuptools.package-data]
protect3 = ["assets/*.bin", "assets/*.json"]
